[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aitext"
version = "0.1.0"
description = "Who does an AI-text detector accuse? An audit on real human and machine texts"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "pyarrow", "scikit-learn>=1.4", "torch", "transformers", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
